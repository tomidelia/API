# Los tests corren contra una base H2 en memoria, asi no hace falta tener
# MySQL levantado ni la password configurada.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Los tests si cargan el catalogo de ejemplo: es su fixture, no datos de la app.
app.seed-demo-data=true

# Cuenta de la tienda para los tests.
app.admin.email=admin@juegosdemesa.com
app.admin.password=admin1234

# El application.properties de test reemplaza al de main, asi que las claves de
# JWT tambien tienen que estar declaradas aca.
